[package]
name = "voryx_crypto_wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
aes-gcm = "0.10.3"
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
base64 = "0.22.1"
curve25519-dalek = "4.1.3"
ed25519-dalek = "2.1.1"
getrandom = { version = "0.2.15", features = ["js"] }
hex = "0.4.3"
hkdf = "0.12.4"
hmac = "0.12.1"
pbkdf2 = "0.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.8"
wasm-bindgen = "0.2.100"
js-sys = "0.3.77"
zeroize = { version = "1.8.1", features = ["alloc"] }
