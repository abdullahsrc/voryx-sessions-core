[package]
name = "voryx_crypto"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.22.1"
curve25519-dalek = "4.1.3"
ed25519-dalek = "2.1.1"
hex = "0.4.3"
hkdf = "0.12.4"
napi = { version = "2.16.12", default-features = false, features = ["napi4"] }
napi-derive = "2.16.12"
rand = "0.8.5"
sha2 = "0.10.8"
subtle = "2.6.1"
zeroize = { version = "1.8.1", features = ["alloc"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
